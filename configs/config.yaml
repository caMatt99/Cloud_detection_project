dataset:
  path:
    colab: "/content/drive/MyDrive/cloud_detection/dataset"
    local: "/Users/matteo/Desktop/Cloud_detection_project/data/dataset"  
  image_size: 224
  batch_size: 12
  
training:
  epochs: 60
  optimizer: "sgd"
  learning_rate: 0.0001
  momentum: 0.8
  weight_decay: 0.0005 

model:
  name: "convnext_base"
  pretrained: true
  num_classes: 2
  dropout_rate: 0.3  # 0.3 for ConvNeXt/CNNs, 0.5 for ViT

paths:
  checkpoints:
    colab: "/content/drive/MyDrive/cloud_detection/checkpoints"
    local: "./checkpoints"
  results:
    colab: "/content/project/results"
    local: "./results"
