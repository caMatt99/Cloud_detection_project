dataset:
  path:
    colab: "/content/drive/MyDrive/cloud_detection/dataset"
    local: "./data"
  image_size: 224
  batch_size: 12

training:
  epochs: 60
  optimizer: "sgd"
  learning_rate: 0.0001
  momentum: 0.8
  weight_decay: 0.00001

model:
  name: "convnext_base"
  pretrained: true
  num_classes: 2

paths:
  checkpoints:
    colab: "/content/drive/MyDrive/cloud_detection/checkpoints"
    local: "./checkpoints"
  results:
    colab: "/content/project/results"
    local: "./results"
